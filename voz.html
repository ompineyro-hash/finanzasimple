<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Prueba Voz 2</title><style>body{font-family:Arial;background:#f3f6f8;margin:0}.w{max-width:620px;margin:auto;padding:18px}.c{background:#fff;padding:20px;border-radius:18px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:bold}.s{background:#6847d8;color:#fff}.p{background:#c0392b;color:#fff}.box{margin-top:12px;padding:12px;border-radius:10px;background:#eef2f5}.grid{display:grid;grid-template-columns:105px 1fr;gap:8px;margin-top:18px}.v{background:#eef2f5;padding:9px;border-radius:8px}</style></head><body><div class='w'><div class='c'><h2>🎤 FinanzaSimple — Prueba Voz 2</h2><p>Prueba aislada. Abrila desde una dirección https:// en el celular.</p><div class='btns'><button id='start' class='s'>🎤 EMPEZAR</button><button id='stop' class='p' disabled>⏹ PARAR</button></div><div id='status' class='box'>Listo para escuchar.</div><div id='trans' class='box'>Lo que escuche aparecerá acá.</div><div class='grid'><b>Fecha</b><div id='fecha' class='v'>—</div><b>Tipo</b><div id='tipo' class='v'>—</div><b>Cuenta</b><div id='cuenta' class='v'>—</div><b>Categoría</b><div id='categoria' class='v'>—</div><b>Detalle</b><div id='detalle' class='v'>—</div><b>Monto</b><div id='monto' class='v'>—</div></div><p><small>Decí: “Ayer gasté 35 mil pesos en supermercado con la tarjeta”.</small></p></div></div><script>
const $=x=>document.getElementById(x),SR=window.SpeechRecognition||window.webkitSpeechRecognition;let r,final='';
function parse(t){let q=t.toLowerCase(),d=new Date();if(q.includes('ayer'))d.setDate(d.getDate()-1);$('fecha').textContent=d.toLocaleDateString('es-AR');$('tipo').textContent=/(cobr|ingres|recib|sueldo)/.test(q)?'Ingreso':'Gasto';$('cuenta').textContent=/tarjeta|crédito|debito|débito/.test(q)?'Tarjeta':/efectivo/.test(q)?'Efectivo':/mercado pago/.test(q)?'Mercado Pago':/banco|transferencia/.test(q)?'Banco':'—';let c='Otros',det='—';if(/supermercado|verduler|comida|almuerzo|cena/.test(q)){c='Alimentos';det='Compra'}else if(/nafta|combustible|taxi|uber/.test(q)){c='Transporte';det='Transporte'}else if(/luz|electricidad|gas|internet/.test(q)){c='Servicios';det='Servicio'}else if(/farmacia|médico|salud/.test(q)){c='Salud';det='Salud'}else if(/sueldo/.test(q)){c='Sueldo';det='Sueldo'}$('categoria').textContent=c;$('detalle').textContent=det;let n=null,m=q.match(/(\d[\d\.,]*)\s*(mil|mill[oó]n|millones)?/);if(m){n=parseFloat(m[1].replace(/\./g,'').replace(',','.'));if(/mil/.test(m[2]||''))n*=1000;if(/mill/.test(m[2]||''))n*=1000000}else if(q.includes('treinta y cinco mil'))n=35000;$('monto').textContent=n!==null?'$ '+n.toLocaleString('es-AR'):'No detectado'}
if(!SR){$('status').textContent='Este navegador no ofrece reconocimiento de voz.';$('start').disabled=true}else{r=new SR();r.lang='es-AR';r.continuous=true;r.interimResults=true;r.onstart=()=>{final='';$('status').textContent='🔴 Escuchando... hablá y después tocá PARAR.';$('start').disabled=true;$('stop').disabled=false};r.onresult=e=>{let temp='';for(let i=e.resultIndex;i<e.results.length;i++){let x=e.results[i][0].transcript;if(e.results[i].isFinal)final+=x+' ';else temp+=x}$('trans').textContent=(final+temp).trim()};r.onend=()=>{$('start').disabled=false;$('stop').disabled=true;$('status').textContent='Escucha terminada.';let t=(final||$('trans').textContent).trim();if(t)parse(t)};r.onerror=e=>$('status').textContent='Error: '+e.error;$('start').onclick=()=>{try{r.start()}catch(e){}};$('stop').onclick=()=>{try{r.stop()}catch(e){}}}
</script></body></html>
